name: ci
on: [push, pull_request]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: pip install --extra-index-url https://download.pytorch.org/whl/cpu -r requirements.txt
      - name: lint
        run: ruff check emtrack scripts tests
      - name: type check
        run: mypy
      - name: tests
        run: pytest -q
      - name: tiny end-to-end data generation (lineage manifest round-trip)
        run: python scripts/make_data.py configs/data_ci.yaml && test -f data/ci/manifest.json
  package:
    runs-on: ubuntu-latest
    needs: checks
    steps:
      - uses: actions/checkout@v4
      - name: runtime image builds and loads the committed ONNX package
        run: |
          docker build -t emtrack-runtime .
          docker run --rm emtrack-runtime
